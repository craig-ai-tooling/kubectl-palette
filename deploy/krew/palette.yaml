# Krew manifest template. Do not edit the @...@ values by hand: run
#   hack/krew-manifest.sh <version> <base-url> [checksums-file]
# which fills the version, URIs and sha256 values from the goreleaser checksums file.
apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: palette
spec:
  version: @VERSION@
  homepage: https://github.com/craig-ai-tooling/kubectl-palette
  shortDescription: Target Spectro Palette clusters by name
  description: |
    Log in once through the browser with Spectro Cloud Palette's OIDC provider,
    then name a cluster and run plain kubectl against it. Each terminal gets its
    own single-cluster kubeconfig under ~/.kube/palette. Every OIDC cluster you
    reach is also added as a context in ~/.kube/config, so kubectl --context works
    in any terminal. A local index of cluster names keeps tab completion and the
    cluster picker fast for one cluster or a thousand.
    Commands: login, use, exec, contexts, current, sync, logout.
  caveats: |
    First login:
      kubectl palette login --server <palette-url> --tenant <org>
    This opens a browser once, builds the local cluster index and adds the
    tenant's clusters as contexts in ~/.kube/config (up to 25 clusters; more are
    added as you use them). Turn that off with KUBECTL_PALETTE_NO_CONTEXTS=1 or
    login --no-contexts. Admin credentials are never written there.

    Shell hook, so that "kubectl palette use <cluster>" sets KUBECONFIG in the
    current terminal (add to ~/.zshrc or ~/.bashrc):
      eval "$(kubectl-palette shell-init zsh)"     # or bash
    Without the hook, "use" opens a subshell. "kubectl palette exec <cluster> -- <args>"
    needs no hook.

    Tab completion of cluster names (kubectl 1.26 or newer):
      kubectl palette completion install

    Uninstall. "kubectl krew uninstall palette" leaves two things behind: the
    kubectl_complete-palette link next to the krew bin directory, and the contexts
    in ~/.kube/config. Before uninstalling, run:
      kubectl palette logout --all
    That removes every session and every context the plugin added. After
    uninstalling, delete the kubectl_complete-palette link by hand. Without the
    plugin, "kubectl --context" calls on those contexts fail, because they run
    kubectl-palette token. To remove the contexts later, delete them with
    "kubectl config delete-context <name>" or reinstall the plugin and run
    "kubectl palette contexts remove --all --all-tenants".
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: @URI_linux_amd64@
    sha256: @SHA256_linux_amd64@
    bin: kubectl-palette
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: @URI_linux_arm64@
    sha256: @SHA256_linux_arm64@
    bin: kubectl-palette
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: @URI_darwin_amd64@
    sha256: @SHA256_darwin_amd64@
    bin: kubectl-palette
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: @URI_darwin_arm64@
    sha256: @SHA256_darwin_arm64@
    bin: kubectl-palette
  - selector:
      matchLabels:
        os: windows
        arch: amd64
    uri: @URI_windows_amd64@
    sha256: @SHA256_windows_amd64@
    bin: kubectl-palette.exe
  - selector:
      matchLabels:
        os: windows
        arch: arm64
    uri: @URI_windows_arm64@
    sha256: @SHA256_windows_arm64@
    bin: kubectl-palette.exe
