name: Release

# Builds the archives and checksums with goreleaser and attaches them to a GitHub
# release when a version tag is pushed. Nothing else triggers it.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: goreleaser
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # goreleaser reads tags and history for the version and the changelog.
          fetch-depth: 0

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          # Latest 1.26 patch release, so builds pick up standard library security fixes.
          go-version: '1.26'
          check-latest: true

      - name: Test
        run: go test ./...

      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.20.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attach the krew manifest
        run: |
          version="${GITHUB_REF_NAME#v}"
          hack/krew-manifest.sh "$version" \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}" > dist/palette.yaml
          gh release upload "$GITHUB_REF_NAME" dist/palette.yaml --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
